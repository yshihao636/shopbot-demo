<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopBot 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: app shell — top bar with view switch; client = scene list | phone | PRD notes; admin = grouped sidebar | content */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --surface-2:#f1f5f9; --line:#e2e8f0; --line-2:#cbd5e1;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --accent:#0d9488; --accent-strong:#0f766e; --accent-soft:#e6f6f4; --accent-ink:#ffffff;
  --good:#16a34a; --good-soft:#e8f6ec; --warn:#c2410c; --warn-soft:#fff3e8; --bad:#dc2626; --bad-soft:#fdeeee; --info:#2563eb; --info-soft:#edf3fe;
  --bubble-user:#0d9488; --phone:#e8eeee; --anno:#7c3aed;
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --r:8px; --r-s:5px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a1b; --surface:#182324; --surface-2:#1f2c2d; --line:#2a3a3b; --line-2:#3a4c4d;
  --ink:#e7efef; --ink-2:#c3d0d0; --muted:#8fa3a3; --faint:#6b8080;
  --accent:#2bb5a8; --accent-strong:#5fd0c4; --accent-soft:#163b38; --accent-ink:#06201d;
  --good:#4cc47a; --good-soft:#173322; --warn:#f0954f; --warn-soft:#3a2716; --bad:#f07171; --bad-soft:#3b1f1f; --info:#7aa7f5; --info-soft:#1c2a44;
  --bubble-user:#1f8f85; --phone:#0c1314; --anno:#b494f7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a1b; --surface:#182324; --surface-2:#1f2c2d; --line:#2a3a3b; --line-2:#3a4c4d;
  --ink:#e7efef; --ink-2:#c3d0d0; --muted:#8fa3a3; --faint:#6b8080;
  --accent:#2bb5a8; --accent-strong:#5fd0c4; --accent-soft:#163b38; --accent-ink:#06201d;
  --good:#4cc47a; --good-soft:#173322; --warn:#f0954f; --warn-soft:#3a2716; --bad:#f07171; --bad-soft:#3b1f1f; --info:#7aa7f5; --info-soft:#1c2a44;
  --bubble-user:#1f8f85; --phone:#0c1314; --anno:#b494f7; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;max-width:1480px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:6px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(15,23,42,.08)}
.top .src{margin-left:auto;color:var(--muted);font-size:12px}
.top .src a{color:var(--accent-strong);text-decoration:underline;text-underline-offset:2px}

/* client view */
.client{display:grid;grid-template-columns:220px 390px minmax(0,1fr);gap:24px;max-width:1480px;margin:0 auto;padding-block:20px;align-items:start}
.scenes{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px}
.scenes h3,.navgrp{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;padding:4px 10px 6px}
.scene-btn{display:flex;gap:8px;align-items:baseline;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;color:var(--ink-2)}
.scene-btn span{color:var(--faint);font-size:12px;min-width:28px}
.scene-btn:hover{background:var(--surface-2)}
.scene-btn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:500}
.scene-btn[aria-current="true"] span{color:var(--accent-strong)}
.scene-select{display:none;width:100%;padding:9px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink)}

.phone{width:100%;max-width:390px;height:min(780px,calc(100vh - 110px));min-height:560px;background:var(--phone);border-radius:28px;padding:8px;box-shadow:0 10px 30px rgba(15,23,42,.10)}
.screen{height:100%;background:var(--bg);border-radius:21px;overflow:hidden;display:flex;flex-direction:column}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.chat-head .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.chat-head .t{font-weight:500}
.chat-head .s{font-size:11px;color:var(--good)}
.chat-head .s.busy{color:var(--warn)}
.chat-head .s.off{color:var(--faint)}
.chat-head .restart{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12px;padding:4px 6px;border-radius:5px}
.chat-head .restart:hover{background:var(--surface-2)}
.chat{flex:1;overflow-y:auto;padding:14px 12px 18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;max-width:100%;animation:in .22s ease-out}
@keyframes in{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.msg{animation:none}.chat{scroll-behavior:auto}}
.msg .av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.msg.agent .av{background:var(--info);color:#fff}
.bubble{padding:9px 12px;border-radius:12px;background:var(--surface);color:var(--ink);max-width:82%;box-shadow:0 1px 1px rgba(15,23,42,.04);word-break:break-word}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--bubble-user);color:#fff;border-bottom-right-radius:4px}
.msg.bot .bubble,.msg.agent .bubble{border-top-left-radius:4px}
.msg.cardrow{padding-left:36px}
.msg.cardrow .card{flex:1;min-width:0}
.divider{align-self:center;font-size:11px;color:var(--faint)}
.sys{align-self:center;font-size:12px;color:var(--muted);background:var(--surface-2);padding:3px 10px;border-radius:5px;text-align:center}
.note{align-self:center;font-size:11px;color:var(--faint);text-align:center;padding:0 12px}
.anno{border:1px dashed var(--anno);color:var(--anno);border-radius:6px;padding:6px 9px;font-size:12px;margin-left:36px}
.anno b{font-weight:500}
.typing{display:flex;gap:4px;padding:12px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}

.card{background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.card-h{padding:10px 12px 0;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-b{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card-f{display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
.card .sub{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;min-width:0}
.kv dd.strong{font-weight:700}
.kv dd.money{color:var(--bad);font-weight:700}
.prod{display:flex;gap:10px;align-items:center}
.thumb{width:44px;height:44px;border-radius:6px;background:var(--surface-2);flex:none;display:grid;place-items:center;color:var(--faint);font-size:11px}
.prod .nm{font-size:13px;line-height:1.4}
.prod .pr{margin-left:auto;font-weight:700;white-space:nowrap}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);font-weight:500;white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.acc{background:var(--accent-soft);color:var(--accent-strong)}.tag.info{background:var(--info-soft);color:var(--info)}
.alert{font-size:12px;padding:7px 9px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.alert.good{background:var(--good-soft);color:var(--good)}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.acc{background:var(--accent-soft);color:var(--accent-strong)}
.steps{display:flex;gap:0;font-size:11px;color:var(--faint)}
.steps div{flex:1;text-align:center;position:relative;padding-top:14px}
.steps div::before{content:"";position:absolute;top:3px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--line-2)}
.steps div::after{content:"";position:absolute;top:6px;left:calc(50% + 6px);right:calc(-50% + 6px);height:2px;background:var(--line)}
.steps div:last-child::after{display:none}
.steps .done{color:var(--ink-2)}.steps .done::before{background:var(--accent)}.steps .done::after{background:var(--accent)}
.steps .cur{color:var(--accent-strong);font-weight:500}.steps .cur::before{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.tl{display:flex;flex-direction:column;gap:0;font-size:12px}
.tl div{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:0 0 9px 14px;position:relative;color:var(--muted)}
.tl div::before{content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.tl div::after{content:"";position:absolute;left:3px;top:14px;bottom:0;width:1px;background:var(--line)}
.tl div:last-child::after{display:none}
.tl div.on{color:var(--ink)}.tl div.on::before{background:var(--accent)}
.tl div.bad{color:var(--bad)}.tl div.bad::before{background:var(--bad)}
.tl b{font-weight:500}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:7px 14px;border-radius:7px;font-size:13px;color:var(--ink-2)}
.btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.pri:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn.chosen{outline:2px solid var(--accent);outline-offset:1px;opacity:1}
.card-f .btn{flex:1}
.quick{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;padding-left:36px}
.quick .btn{background:var(--surface);font-size:12px;padding:6px 11px;border-color:var(--accent);color:var(--accent-strong)}
.hot{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hot .btn{text-align:left;font-size:13px;padding:8px 10px}
.err{font-size:12px;color:var(--bad)}
.seg2{display:flex;gap:6px}.seg2 button{flex:1;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:5px;font-size:12px}
.seg2 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:500}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;font-size:26px;line-height:1;padding:0;color:var(--line-2)}
.stars button.on{color:#f59e0b}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:12px;color:var(--ink-2)}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.inputbar{display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.inputbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px;color:var(--ink);font:inherit}
.inputbar button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 14px;font-weight:500}
.inputbar.disabled input,.inputbar.disabled button{opacity:.5}

.notes{display:flex;flex-direction:column;gap:18px;min-width:0}
.notes h2{font-size:20px}
.notes .lead{color:var(--muted);max-width:62ch}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 24px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta div span{display:block;font-size:12px;color:var(--muted)}
.meta div b{font-weight:500}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);max-width:68ch}
.notes h3{font-size:14px}
.hint{font-size:12px;color:var(--muted)}
.hint .anno-key{border:1px dashed var(--anno);color:var(--anno);padding:0 5px;border-radius:4px}

/* admin view */
.admin{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;max-width:1480px;margin:0 auto;min-height:calc(100vh - 56px)}
.side{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);overflow:auto}
.side .navgrp{padding-top:12px}
.side .navgrp:first-child{padding-top:0}
.admin-select{display:none}
.main{padding:20px 0 40px 28px;display:flex;flex-direction:column;gap:20px;min-width:0}
.crumb{font-size:12px;color:var(--muted)}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:22px}
.ph p{margin:2px 0 0;color:var(--muted)}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:26px;font-weight:700;margin:2px 0;letter-spacing:-.01em}
.kpi .v small{font-size:13px;font-weight:400;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--muted)}
.up{color:var(--good)}.down{color:var(--bad)}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;min-width:0}
.panel>h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h3 .r{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.link{border:0;background:none;color:var(--accent-strong);padding:0;font-size:13px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:84px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bar .n{text-align:right;color:var(--ink-2)}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--faint);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart rect.b{fill:var(--accent)}
.chart rect.b:hover{fill:var(--accent-strong)}
.chart path.ln{fill:none;stroke:var(--accent);stroke-width:2}
.chart path.ar{fill:var(--accent-soft)}
.chart circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border-bottom:0}
.li .x{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}
.sev{width:4px;align-self:stretch;border-radius:2px;background:var(--line-2)}
.sev.p0{background:var(--bad)}.sev.p1{background:var(--warn)}.sev.p2{background:#eab308}.sev.p3{background:var(--info)}
.sw{position:relative;width:36px;height:20px;border-radius:10px;background:var(--line-2);border:0;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:18px}
.sw.danger[aria-checked="true"]{background:var(--bad)}
.num-in{width:96px;border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--ink);font:inherit;text-align:right}
.phase{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.phase div{padding:10px;border-radius:7px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.phase div b{display:block;color:var(--ink-2);font-size:13px}
.phase .done{background:var(--accent-soft)}
.phase .cur{background:var(--accent);color:var(--accent-ink)}
.phase .cur b{color:var(--accent-ink)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:3px 0}
.check i{font-style:normal;width:16px;height:16px;border-radius:4px;background:var(--good);color:#fff;display:grid;place-items:center;font-size:11px;flex:none;margin-top:2px}
.trace{display:flex;flex-direction:column;gap:0}
.trace details{border-left:2px solid var(--line);padding:0 0 12px 16px;position:relative}
.trace details::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.trace details.u::before{background:var(--info)}.trace details.ok::before{background:var(--good)}
.trace summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
.trace summary::-webkit-details-marker{display:none}
.trace summary b{font-weight:500}
.trace summary .x{color:var(--muted);font-size:12px}
.trace .body{margin-top:6px;font-size:12px;background:var(--surface-2);border-radius:6px;padding:8px 10px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.q{display:flex;flex-direction:column;gap:6px}
.qi{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:10px;width:100%}
.qi[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qi .x{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}
.score{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px}
.score select{border:1px solid var(--line-2);border-radius:6px;padding:4px 6px;background:var(--surface);color:var(--ink);font:inherit}
.search{border:1px solid var(--line-2);border-radius:7px;padding:7px 10px;background:var(--surface);color:var(--ink);font:inherit;min-width:0;width:220px;max-width:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap}

.fix{font-size:12px;color:var(--anno);border:1px dashed var(--anno);border-radius:6px;padding:6px 9px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));

const tag=(t,k)=>`<span class="tag ${k||''}">${t}</span>`;
const card=(h,b)=>`<div class="card">${h?`<div class="card-h">${h}</div>`:''}<div class="card-b">${b}</div><div class="card-f"></div></div>`;
const prod=(nm,pr,sub)=>`<div class="prod"><div class="thumb">图</div><div class="nm">${nm}${sub?`<div class="sub">${sub}</div>`:''}</div><div class="pr">${pr}</div></div>`;

const chat=$('#chat');let queue=[],ctx={},runId=0,current=null,curScene=null;
function append(s){
  let el;
  if(s.div){el=h('div','divider',s.div)}
  else if(s.user){el=h('div','msg user',`<div class="bubble">${esc(s.user)}</div>`)}
  else if(s.bot){el=h('div','msg bot',`<div class="av">SB</div><div class="bubble">${s.bot}</div>`)}
  else if(s.agent){el=h('div','msg agent',`<div class="av">W</div><div class="bubble">${s.agent}</div>`)}
  else if(s.card){el=h('div','msg cardrow',s.card)}
  else if(s.sys){el=h('div','sys',s.sys)}
  else if(s.note){el=h('div','note',s.note)}
  else if(s.anno){el=h('div','anno',s.anno)}
  if(el){chat.appendChild(el);chat.scrollTop=chat.scrollHeight}
  return el;
}
function h(tag,cls,html){const e=document.createElement(tag);e.className=cls;e.innerHTML=html;return e}
function setHeader(o){if(o.title)$('#head-title').textContent=o.title;if(o.status){const s=$('#head-status');s.textContent=o.status;s.className='s '+(o.cls||'')}}
function setInput(on){const f=$('#inputbar');f.classList.toggle('disabled',!on);$('#msg-input').disabled=!on;f.querySelector('button').disabled=!on;$('#msg-input').placeholder=on?'输入消息，例如「我要退货」':'暂时无法发送'}
async function run(){
  const my=++runId;
  while(queue.length){
    if(my!==runId)return;
    let s=queue.shift();
    if(typeof s==='function')s=s(ctx);
    if(!s||s.mark)continue;
    if(s.header){setHeader(s.header);continue}
    if(s.input===false){setInput(false);continue}
    if(s.c12){queue=C12_REST.slice().concat(queue);continue}
    if(s.wait){renderWait(s.wait);return}
    if(s.bot||s.agent||s.card){
      const t=h('div','msg bot',`<div class="av">${s.agent?'W':'SB'}</div><div class="bubble typing"><i></i><i></i><i></i></div>`);
      chat.appendChild(t);chat.scrollTop=chat.scrollHeight;await sleep(s.card?380:520);t.remove();if(my!==runId)return;
    } else await sleep(160);
    if(my!==runId)return;
    append(s);
  }
}
function renderWait(w){
  const rest=queue.slice();queue=[];
  let host,last=chat.lastElementChild;
  if(w.into){host=chat.querySelector(`.msg:last-of-type ${w.into}`)||[...chat.querySelectorAll(w.into)].pop()}
  else if(!w.row&&last&&last.classList.contains('cardrow')){host=last.querySelector('.card-f')}
  if(!host){host=h('div','quick','');chat.appendChild(host)}
  const btns=w.acts.map(a=>{
    const b=document.createElement('button');b.type='button';
    b.className='btn'+(a.primary?' pri':'');
    if(a.html){b.innerHTML=a.html;b.style.textAlign='left';b.style.width='100%'}else b.textContent=a.label;
    b.addEventListener('click',()=>{
      const cardEl=b.closest('.card');
      if(a.validate&&cardEl){const e=a.validate(cardEl),er=cardEl.querySelector('.err');if(er){er.hidden=!e;er.textContent=e}if(e)return}
      btns.forEach(x=>x.disabled=true);b.classList.add('chosen');
      if(cardEl)cardEl.querySelectorAll('input,textarea,.seg2 button,.stars button,.chips button').forEach(x=>x.disabled=true);
      if(a.set)a.set(ctx);
      if(a.go){playScene(a.go);return}
      let next=[];
      if(a.say)next.push({user:a.say});
      if(a.steps)next=next.concat(a.steps);
      if(a.goStep){const sc=SCENES.find(x=>x.id===curScene);const i=sc.steps.findIndex(x=>x&&x.mark===a.goStep);next=next.concat(sc.steps.slice(i))}
      else if(!a.steps||a.cont)next=next.concat(rest);
      queue=next;run();
    });
    host.appendChild(b);return b;
  });
  chat.scrollTop=chat.scrollHeight;
}

chat.addEventListener('click',e=>{
  const sb=e.target.closest('.seg2 button');
  if(sb&&!sb.disabled){const g=sb.parentElement;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===sb));const c=sb.closest('.card');c.querySelectorAll('[data-tt]').forEach(f=>f.hidden=f.dataset.tt!==sb.dataset.v);return}
  const st=e.target.closest('.stars button');
  if(st&&!st.disabled){const n=+st.dataset.s;st.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.s<=n));const d=['非常不满意','不满意','一般','满意','非常满意'];st.closest('.card').querySelector('.rate-desc').textContent=`${n}/5 · 您选择了：${d[n-1]}`;return}
  const ch=e.target.closest('.chips button');
  if(ch&&!ch.disabled){ch.setAttribute('aria-pressed',ch.getAttribute('aria-pressed')!=='true')}
});

function playScene(id){
  const sc=SCENES.find(s=>s.id===id)||SCENES[0];curScene=sc.id;
  runId++;chat.innerHTML='';ctx={};setInput(true);

  queue=sc.steps.slice();run();
  document.querySelectorAll('.scene-btn').forEach(b=>b.setAttribute('aria-current',b.dataset.id===sc.id));
  $('#scene-select').value=sc.id;
  const p=sc.prd;

const kpi=(l,v,d,cls)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d ${cls||''}">${d||''}</div></div>`;
const tbl=(head,rows,numCols=[])=>`<div class="tbl"><table><thead><tr>${head.map((x,i)=>`<th class="${numCols.includes(i)?'num':''}">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${numCols.includes(i)?'num':''}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const bars=(items,max,fmt)=>`<div class="bars">${items.map(([l,v,t])=>`<div class="bar" title="${l}：${t||v}"><span>${l}</span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><span class="n">${t||v}</span></div>`).join('')}</div>`;
function vbars(vals,labels,unit,h=150){const W=600,H=h,pl=34,pb=20,pt=8,mx=Math.ceil(Math.max(...vals)/100)*100||1,bw=(W-pl)/vals.length;
  const y=v=>pt+(H-pt-pb)*(1-v/mx);let g='';
  [0,.5,1].forEach(f=>{const yy=y(mx*f);g+=`<line class="gl" x1="${pl}" x2="${W}" y1="${yy}" y2="${yy}"/><text class="ax" x="${pl-6}" y="${yy+3}" text-anchor="end">${Math.round(mx*f)}</text>`});
  vals.forEach((v,i)=>{const x=pl+i*bw+2,hh=H-pb-y(v);g+=`<rect class="b" x="${x}" y="${y(v)}" width="${Math.max(bw-4,2)}" height="${hh}" rx="2"><title>${labels[i]}：${v}${unit}</title></rect>`;if(labels.length<=12||i%3===0)g+=`<text class="ax" x="${x+(bw-4)/2}" y="${H-5}" text-anchor="middle">${labels[i]}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="柱状图">${g}</svg></div>`}
function line(vals,labels,lo,hi){const W=600,H=140,pl=34,pb=20,pt=10,x=i=>pl+i*(W-pl-14)/(vals.length-1),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g='';[lo,(lo+hi)/2,hi].forEach(v=>{g+=`<line class="gl" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v.toFixed(1)}</text>`});
  const d=vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join('');
  g+=`<path class="ar" d="${d}L${x(vals.length-1)},${H-pb}L${x(0)},${H-pb}Z"/><path class="ln" d="${d}"/>`;
  vals.forEach((v,i)=>{g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?5:3.5}"><title>${labels[i]}：${v}</title></circle><text class="ax" x="${x(i)}" y="${H-5}" text-anchor="middle">${labels[i]}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="折线图">${g}</svg></div>`}

function showPage(id){curPage=PAGES[id]?id:'a01';$('#main').innerHTML=PAGES[curPage]();renderSide();try{history.replaceState(null,'','#'+curPage)}catch(e){}window.scrollTo(0,0)}

$('#main').addEventListener('click',e=>{
  const t=e.target;
  const go=t.closest('[data-go]');if(go){showPage(go.dataset.go);return}
  const sw=t.closest('.sw');if(sw){const on=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',on);toast(`${sw.dataset.name}：已${on?'开启':'关闭'}，≤1 分钟生效，原因已记入审计日志`);return}
  const f=t.closest('.filters button');if(f){f.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===f));return}
  const ch=t.closest('.chips button');if(ch){if(ch.classList.contains('qr')){$('#agent-in').value=ch.textContent}else{ch.setAttribute('aria-pressed',ch.getAttribute('aria-pressed')!=='true');if(ch.closest('#safety-marks'))scoreJudge()}return}

  if(t.id==='rej'){$('#rej-box').hidden=false;$('#rej-text').focus();return}
  if(t.id==='rej-ok'){const v=$('#rej-text').value.trim();$('#rej-err').hidden=!!v;if(v){$('#rej-box').hidden=true;toast('已拒绝，原因已同步给用户')}return}

});
$('#main').addEventListener('input',e=>{
  if(e.target.id==='intent-q')$('#intent-t').innerHTML=intentTable(e.target.value);
  if(e.target.id==='faq-q')$('#faq-t').innerHTML=faqTable(e.target.value.trim());
});
function scoreJudge(){const v=[...document.querySelectorAll('#score-form select.dim')].map(s=>+s.value);$('#score-avg').textContent=(v.reduce((a,b)=>a+b)/v.length).toFixed(1)+' / 5.0';const w=[.2,.25,.1,.15,.3].reduce((a,x,i)=>a+x*v[i],0);const safe=document.querySelector('#safety-marks button[aria-pressed="true"]');$('#score-w').textContent=w.toFixed(2)+(w<3.5?' · 不合格':safe?' · 不合格（安全标记）':' · 合格')}
$('#main').addEventListener('change',e=>{if(e.target.closest('#score-form')&&e.target.matches('select.dim'))scoreJudge()});

/* view switch */
function setView(v){const c=v==='client';$('#tab-client').setAttribute('aria-selected',c);$('#tab-admin').setAttribute('aria-selected',!c);$('#view-client').hidden=!c;$('#view-admin').hidden=c;
  if(c)playScene(curScene||'c01');else showPage(curPage)}
$('#tab-client').onclick=()=>setView('client');$('#tab-admin').onclick=()=>setView('admin');
const h0=(location.hash||'').slice(1);
if(PAGES[h0]){curPage=h0;setView('admin')}else{curScene=SCENES.some(s=>s.id===h0)?h0:'c01';setView('client')}
</script>
</html>
